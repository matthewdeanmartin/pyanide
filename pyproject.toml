[project]
name = "pyanide"
version = "1.1.0"
description = "Tools for killing processes and keeping them dead."
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
authors = [{ name = "Matthew Martin", email = "matthewdeanmartin@gmail.com" }]
keywords = ["kill", "exit"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.6",
]
dependencies = [
    "mistune",
    "mdformat",
    "tabulate",
]

[project.urls]
Repository = "https://github.com/matthewdeanmartin/pyanide"
Homepage = "https://github.com/matthewdeanmartin/pyanide"
Documentation = "https://github.com/matthewdeanmartin/pyanide"
"Bug Tracker" = "https://github.com/matthewdeanmartin/pyanide/issues"
"Change Log" = "https://github.com/matthewdeanmartin/pyanide/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pyanide"]
include = [
    "pyanide/**/*.py",
    "pyanide/**/*.md",
    "pyanide/**/*.txt",
    "pyanide/**/*.html",
    "pyanide/**/*.jinja",
]

[dependency-groups]
dev = [
    "pytest",
    "vermin",
    "hypothesis[cli]",
    "pre-commit",
    "mypy",
    "pylint>=3.0",
    "jiggle-version>=2.1.0",
    "troml-dev-status>=0.6.0; python_version >= '3.9'",
    "dont-be-lazy>=0.1.2; python_version >= '3.10'",
    "pydoc-fork>=3.0.0; python_version >= '3.10'",
]

[tool.uv]
default-groups = ["dev"]

[tool.uv.pip]
universal = true
[tool.black]
line-length = 120
target-version = ['py39']
include = '\.pyi?$'
exclude = '''

(
  /(
      \.eggs         # exclude a few common directories in the
    | \.git          # root of the project
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
  )/
  | foo.py           # also separately exclude a file named foo.py in
                     # the root of the project
)
'''

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = [
    "tests",
]
junit_family = "xunit1"
norecursedirs = ["vendor", "scripts"]
# don't know how to do this in toml
#addopts = "--strict-markers"
#markers =
#	slow: marks tests as slow (deselect with '-m "not slow"')
#	fast: marks tests as fast (deselect with '-m "not fast"')

[tool.isort]
default_section = "THIRDPARTY"
force_grid_wrap = 0
include_trailing_comma = true
known_first_party = ["pyanide"]
line_length = 88
multi_line_output = 3
use_parentheses = true

[tool.ruff]
line-length = 1000

# Enable Pyflakes `E` and `F` codes by default.
select = ["E", "F"]
ignore = [
    "E722",
    "E501",
]

# Exclude a variety of commonly ignored directories.
exclude = [
    "dead_code",
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    "hide"
]
per-file-ignores = { }

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

# Assume Python 3.10.
target-version = "py311"

[tool.scriv]
format = "md"
version = "literal: pyproject.toml: project.version"

[tool.hatch.version]
path = "pyanide/__init__.py"
output_file = "CHANGELOG.${config:format}"

